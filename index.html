<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Murmur Onboarding Works!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b0221;
      --sky-top: #0b0221;
      --sky-mid: #2a0845;
      --sky-low: #6a1b6b;
      --pink: #ff2a6d;
      --magenta: #ff4ecd;
      --cyan: #05d9e8;
      --sun-top: #ffe45e;
      --sun-low: #ff2a6d;
      --horizon: 58%;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: #fff;
      font-family: "Press Start 2P", ui-monospace, monospace;
      cursor: none;
    }

    /* ---------- Sky ---------- */
    .sky {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 35%, var(--sky-low) var(--horizon), var(--ink) var(--horizon));
    }

    .stars {
      position: fixed;
      inset: 0 0 calc(100% - var(--horizon)) 0;
      pointer-events: none;
    }

    /* Each star is a single pixel that breathes on its own clock (set inline by JS). */
    .star {
      --s: 2px;
      --c: #fff;
      position: absolute;
      width: var(--s);
      height: var(--s);
      background: var(--c);
      box-shadow: 0 0 4px var(--c);
      opacity: .25;
      animation: twinkle var(--d, 3s) ease-in-out var(--delay, 0s) infinite;
    }

    /* Bright stars flare into a pixel "+" glint now and then. */
    .star.glint {
      --s: 3px;
      box-shadow:
        var(--s) 0 0 var(--c), calc(-1 * var(--s)) 0 0 var(--c),
        0 var(--s) 0 var(--c), 0 calc(-1 * var(--s)) 0 var(--c),
        0 0 14px 3px var(--c);
      animation-name: glint;
    }

    @keyframes twinkle {
      0%, 100% { opacity: .2; transform: scale(.7); }
      50%      { opacity: 1;  transform: scale(1); }
    }

    @keyframes glint {
      0%, 60%, 100% { opacity: .4; transform: scale(.55); }
      78%           { opacity: 1;  transform: scale(1.25); }
    }

    /* ---------- Sun ---------- */
    .sun {
      position: fixed;
      left: 50%;
      bottom: calc(100% - var(--horizon));
      width: min(46vmin, 420px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background: linear-gradient(180deg, var(--sun-top) 10%, #ff9a3c 45%, var(--sun-low) 80%);
      box-shadow: 0 0 80px 10px rgba(255, 42, 109, .45);
      /* Classic synthwave slats: bands that thicken toward the horizon */
      -webkit-mask: linear-gradient(180deg,
        #000 0 52%, transparent 52% 55%,
        #000 55% 64%, transparent 64% 68%,
        #000 68% 76%, transparent 76% 81%,
        #000 81% 87%, transparent 87% 93%,
        #000 93% 97%, transparent 97% 100%);
              mask: linear-gradient(180deg,
        #000 0 52%, transparent 52% 55%,
        #000 55% 64%, transparent 64% 68%,
        #000 68% 76%, transparent 76% 81%,
        #000 81% 87%, transparent 87% 93%,
        #000 93% 97%, transparent 97% 100%);
    }

    /* ---------- Mountains ---------- */
    .mountains {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(100% - var(--horizon));
      height: clamp(48px, 12vh, 130px);
      width: 100%;
    }

    /* ---------- Perspective grid ---------- */
    .grid-wrap {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      top: var(--horizon);
      perspective: 320px;
      perspective-origin: 50% 0%;
      overflow: hidden;
      background: linear-gradient(180deg, #1a0433, var(--ink) 60%);
    }

    .grid {
      position: absolute;
      left: -100%;
      width: 300%;
      height: 200%;
      top: 0;
      transform-origin: 50% 0;
      transform: rotateX(72deg);
      background-image:
        linear-gradient(var(--magenta) 2px, transparent 2px),
        linear-gradient(90deg, var(--magenta) 2px, transparent 2px);
      background-size: 60px 60px;
      filter: drop-shadow(0 0 4px var(--magenta));
      animation: drive 1.2s linear infinite;
    }

    @keyframes drive { to { background-position: 0 60px; } }

    /* Fade the grid into the horizon haze */
    .grid-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--sky-low) 0%, rgba(106, 27, 107, .35) 18%, transparent 45%);
      pointer-events: none;
    }

    .horizon-line {
      position: fixed;
      left: 0; right: 0;
      top: var(--horizon);
      height: 2px;
      background: var(--pink);
      box-shadow: 0 0 12px 2px var(--pink), 0 0 40px 6px rgba(255, 42, 109, .5);
    }

    /* ---------- CRT overlay ---------- */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
      mix-blend-mode: multiply;
      z-index: 5;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
      z-index: 5;
    }

    /* ---------- Hero ---------- */
    .hero {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: clamp(18px, 3vh, 32px);
      padding: 0 6vw;
      text-align: center;
      z-index: 3;
      transform: translateY(-12vh);
    }

    .kicker {
      margin: 0;
      font-size: clamp(9px, 1.1vw, 12px);
      letter-spacing: .35em;
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan);
    }

    h1 {
      margin: 0;
      font-family: "Monoton", "Press Start 2P", cursive;
      font-weight: 400;
      font-size: clamp(34px, 8.6vw, 132px);
      line-height: .95;
      letter-spacing: .02em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff 0%, #ffd1f3 30%, var(--magenta) 55%, var(--pink) 70%, #7b2ff7 100%);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      filter:
        drop-shadow(0 0 2px rgba(255,255,255,.8))
        drop-shadow(0 0 18px rgba(255, 78, 205, .75))
        drop-shadow(0 6px 0 rgba(11, 2, 33, .9));
      animation: flicker 6s infinite;
    }

    h1 .line { display: block; }

    h1 .accent {
      font-family: "Press Start 2P", monospace;
      font-size: .34em;
      letter-spacing: .12em;
      margin-top: .5em;
      background: linear-gradient(180deg, #fff, var(--cyan));
      -webkit-background-clip: text;
              background-clip: text;
      filter: drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 10px var(--cyan));
    }

    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: .55; }
      94% { opacity: 1; }
      96% { opacity: .7; }
      97% { opacity: 1; }
    }

    .press-start {
      margin: clamp(8px, 2vh, 20px) 0 0;
      font-size: clamp(10px, 1.2vw, 14px);
      letter-spacing: .2em;
      color: var(--sun-top);
      text-shadow: 0 0 8px rgba(255, 228, 94, .8);
      animation: blink 1.1s steps(2, start) infinite;
    }

    @keyframes blink { to { visibility: hidden; } }

    .hud {
      position: fixed;
      top: 20px;
      left: 24px; right: 24px;
      display: flex;
      justify-content: space-between;
      font-size: clamp(8px, 1vw, 11px);
      letter-spacing: .15em;
      color: #fff;
      opacity: .85;
      z-index: 4;
      text-shadow: 0 0 6px var(--magenta);
    }

    .hud b { color: var(--cyan); font-weight: 400; }

    /* ---------- Cursor + sparkles ---------- */
    #sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }

    #unicorn {
      position: fixed;
      left: 0; top: 0;
      width: 48px;
      height: 48px;
      pointer-events: none;
      z-index: 9;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 6px rgba(255, 78, 205, .9));
      transform: translate3d(-100px, -100px, 0);
      will-change: transform;
    }

    #unicorn svg { display: block; width: 100%; height: 100%; }

    @media (hover: none) {
      html, body { cursor: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .grid, .star, h1, .press-start { animation: none; }
      .star { opacity: .7; }
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="sun"></div>
  <svg class="mountains" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 L90 60 L160 95 L260 30 L360 90 L420 70 L520 110 L680 110 L780 55 L850 85 L950 20 L1060 80 L1120 62 L1200 100 L1200 120 Z"
          fill="#1a0433" stroke="#05d9e8" stroke-width="1.5" stroke-opacity=".7" vector-effect="non-scaling-stroke" />
  </svg>
  <div class="grid-wrap"><div class="grid"></div></div>
  <div class="horizon-line"></div>

  <header class="hud" aria-hidden="true">
    <span>1UP <b>001984</b></span>
    <span>HI-SCORE <b>999999</b></span>
  </header>

  <main class="hero">
    <p class="kicker">★ PLAYER ONE READY ★</p>
    <h1>
      <span class="line">Murmur</span>
      <span class="line">Onboarding</span>
      <span class="line accent">WORKS!</span>
    </h1>
    <p class="press-start">PRESS START</p>
  </main>

  <canvas id="sparkles"></canvas>
  <div id="unicorn" aria-hidden="true"></div>

  <div class="scanlines"></div>
  <div class="vignette"></div>

  <script>
    (() => {
      /* ---------- Pixel unicorn glyph (16×16) ---------- */
      const PALETTE = {
        k: "#1b0b3a", // outline
        w: "#ffffff", // body
        s: "#e7d9ff", // body shade
        y: "#ffe45e", // horn
        p: "#ff2a6d", // mane pink
        m: "#ff4ecd", // mane magenta
        c: "#05d9e8", // mane cyan
        v: "#7b2ff7", // mane violet
        e: "#1b0b3a", // eye
      };
      const SPRITE = [
        "......y.........",
        ".....yk.........",
        "....kyk.........",
        "...kwwkpm.......",
        "..kwwwwkmc......",
        ".kwewwwwkcv.....",
        ".kwwwwwwwkvp....",
        "kwwwwwwwwwkpm...",
        ".kkkwwwwwwwkm...",
        "...kwwwwwwwwkc..",
        "...kwwwwwwwwwkv.",
        "...kwwssswwwwwkp",
        "...kwkkkkkwkwwkm",
        "...kwk...kwkkwkc",
        "...kk....kk..kk.",
        "................",
      ];
      const size = SPRITE.length;
      const rects = [];
      SPRITE.forEach((row, y) => [...row].forEach((ch, x) => {
        if (PALETTE[ch]) rects.push(`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PALETTE[ch]}"/>`);
      }));
      const unicorn = document.getElementById("unicorn");
      unicorn.innerHTML = `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">${rects.join("")}</svg>`;

      /* ---------- Twinkling starfield ---------- */
      const STAR_TINTS = ["#fff", "#fff", "#fff", "#fff", "#bdf6ff", "#ffd1f3"];
      const starfield = document.querySelector(".stars");
      const starCount = Math.round(Math.min(110, Math.max(45, innerWidth * innerHeight / 12000)));
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement("span");
        const glint = Math.random() < 0.12;
        star.className = glint ? "star glint" : "star";
        const size = glint ? 3 : (Math.random() < 0.35 ? 3 : 2);
        const duration = glint ? 4 + Math.random() * 4 : 2 + Math.random() * 3;
        star.style.cssText = [
          `left:${(Math.random() * 100).toFixed(2)}%`,
          // Bias toward the top of the sky so the horizon glow stays clean.
          `top:${(Math.pow(Math.random(), 1.4) * 92).toFixed(2)}%`,
          `--s:${size}px`,
          `--c:${STAR_TINTS[(Math.random() * STAR_TINTS.length) | 0]}`,
          `--d:${duration.toFixed(2)}s`,
          `--delay:${(-Math.random() * duration).toFixed(2)}s`,
        ].join(";");
        starfield.append(star);
      }

      /* ---------- Sparkle trail ---------- */
      const canvas = document.getElementById("sparkles");
      const ctx = canvas.getContext("2d");
      const COLORS = ["#ff2a6d", "#ff4ecd", "#05d9e8", "#ffe45e", "#7b2ff7", "#ffffff"];
      const particles = [];
      let dpr = 1;

      const resize = () => {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth + "px";
        canvas.style.height = innerHeight + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;
      };
      resize();
      addEventListener("resize", resize);

      const spawn = (x, y, count, burst = false) => {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const speed = burst ? 2 + Math.random() * 5 : Math.random() * 1.4;
          particles.push({
            x, y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed - (burst ? 1 : 0.3),
            life: 1,
            decay: 0.012 + Math.random() * 0.02,
            size: 2 + Math.floor(Math.random() * 3),
            color: COLORS[(Math.random() * COLORS.length) | 0],
            star: Math.random() < 0.35,
          });
        }
      };

      // Chunky pixel sparkle: a "+" of squares, snapped to the pixel grid.
      const drawStar = (p) => {
        const s = p.size;
        const x = Math.round(p.x / s) * s;
        const y = Math.round(p.y / s) * s;
        ctx.fillRect(x, y, s, s);
        if (p.star && p.life > 0.35) {
          ctx.fillRect(x - s, y, s, s);
          ctx.fillRect(x + s, y, s, s);
          ctx.fillRect(x, y - s, s, s);
          ctx.fillRect(x, y + s, s, s);
        }
      };

      const tick = () => {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.04;       // gentle gravity
          p.vx *= 0.98;
          p.life -= p.decay;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          drawStar(p);
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);

      /* ---------- Cursor tracking ---------- */
      // Sprite renders at 3px per pixel; the horn tip (6,0) is the hotspot.
      const SCALE = 3, HOT_X = 6 * SCALE, HOT_Y = 0;
      const TAIL_X = (15 - 6) * SCALE, TAIL_Y = 12 * SCALE;

      const move = (x, y) => {
        unicorn.style.transform = `translate3d(${x - HOT_X}px, ${y - HOT_Y}px, 0)`;
        spawn(x + TAIL_X, y + TAIL_Y, 3);
      };

      addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
      addEventListener("pointerdown", (e) => spawn(e.clientX, e.clientY, 60, true));
      addEventListener("pointerleave", () => { unicorn.style.transform = "translate3d(-100px,-100px,0)"; });

      /* ---------- Konami code: rainbow overdrive ---------- */
      const KONAMI = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
      let k = 0;
      addEventListener("keydown", (e) => {
        k = e.key === KONAMI[k] ? k + 1 : (e.key === KONAMI[0] ? 1 : 0);
        if (k === KONAMI.length) {
          k = 0;
          for (let i = 0; i < 12; i++) {
            setTimeout(() => spawn(Math.random() * innerWidth, Math.random() * innerHeight * 0.6, 50, true), i * 120);
          }
        }
      });
    })();
  </script>
</body>
</html>
